---
version: "2"
linters:
  default: all
  disable:
    - contextcheck # profile operations do not take a context
    - cyclop # already using gocyclo, and its good enough!
    - depguard
    - exhaustruct
    - exhaustruct_v5 # successor to exhaustruct
    - gochecknoglobals # globals are used as test seams
    - noinlineerr # inline error handling is idiomatic here
    - nonamedreturns
    - paralleltest
    - perfsprint
    - tagliatelle # external JSON fields use snake_case
    - testpackage # tests exercise unexported helpers
    - varnamelen
    - wrapcheck
    - wsl_v5
    - gomodguard # deprecated
    - wsl # deprecated, wsl_v5 included in all ofc
  settings:
    funlen:
      lines: 150
      statements: 50
    gocritic:
      disabled-checks:
        - whyNoLint
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 20
    importas:
      alias:
        - pkg: github.com/carlmontanari/boxen/boxen
          alias: boxen
        - pkg: github.com/carlmontanari/boxen/(\w+)
          alias: boxen$1
        - pkg: github.com/scrapli/scrapligo/v2/(\w+)
          alias: scrapligo$1
      no-unaliased: true
    lll:
      line-length: 100
      tab-width: 4
    staticcheck:
      checks:
        - -ST1000
  exclusions:
    rules:
      - linters:
          - revive
        text: package-comments
      - linters:
          - revive
        path: constants/boxen.go
        text: exported const
      - linters:
          - revive
        path: constants/containerlab.go
        text: exported const
      - linters:
          - revive
        path: constants/flags.go
        text: exported const
      - linters:
          - revive
        path: constants/env.go
        text: exported const
      - linters:
          - goconst
          - gocognit
        path: _test\.go
      - linters:
          - goconst
        path: agent/tcservice.go
      - linters:
          - revive
        path: ^(container/types/run.go|errors/errors.go|util/os.go)$
        text: var-naming
    warn-unused: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
