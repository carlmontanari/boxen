---
name: cisco_n9kv
diskPatterns:
  - "(?i)nxosv.*.qcow2"
versionPattern: "(?i)\\d+\\.\\d+\\.\\d+"
scrapliDefinitionNameOrFile: cisco_nxos
scrapliReturnChar: "\r"
extraFiles:
  - OVMF.fd
virtualMachine:
  emulate: max
  memory: 10240
  cpuCores: 4
  serialPortCount: 1
  nicType: e1000
  nicCount: 8
  nicPerBus: 26
  natPorts:
  - type: tcp
    localPort: 22
  - type: tcp
    localPort: 23
  - type: tcp
    localPort: 443
  - type: tcp
    localPort: 830
  - type: udp
    localPort: 161
  mutators: {}
  overrides:
    disk:
      - onPackage: true
        onRun: true
        val:
          - content: -drive
          # will already be converted from the "raw" disk -> "disk.qcow2"
          - content: if=none,file=disk.qcow2,format=qcow2,id=drive-sata-disk0
          - content: -device
          - content: ahci,id=ahci0,bus=pci.0
          - content: -device
          - content: ide-hd,drive=drive-sata-disk0,bus=ahci0.0,id=drive-sata-disk0,bootindex=1
  extras:
    - onPackage: true
      onRun: true
      val:
        - content: -bios
        - content: OVMF.fd
    - onPackage: true
      onRun: true
      val:
        - content: -boot
        - content: c
packaging:
  process:
    # handle initial poap/provisioning dialog
    - type: prompts
      prompts:
        timeout: 20m
        prompts:
          - prompt:
              contains: "(yes/skip/no)[no]:"
            response: yes
            once: true
          - prompt:
              contains: "Do you want to enforce secure password standard (yes/no) [y]:"
            response: "no"
            once: true
          - prompt:
              contains: "Enter the password for \"admin\""
            response: "admin"
            once: true
            hidden: true
          - prompt:
              contains: "Confirm the password for \"admin\""
            response: "admin"
            once: true
            hidden: true
          - prompt:
              contains: "Would you like to enter the basic configuration dialog (yes/no):"
            response: "no"
            once: true
          - prompt:
              contains: "login:"
            response: "admin"
            once: true
          - prompt:
              contains: "Password:"
            response: "admin"
            once: true
            hidden: true
          - prompt:
              contains: "switch#"
            response: ""
            once: true
            completes: true
    # disable pagination
    - type: write
      write:
        content: |
          term len 0
          term width 511
    # base config, then save
    - type: write
      write:
        content: |
          configure terminal
          no password strength-check
          username admin password 0 admin role network-admin
          interface mgmt0
          ip address 10.0.0.15/24
          no shutdown
          exit
          feature scp-server
          feature nxapi
          feature netconf
          feature grpc
          boot nxos bootflash:///nxos.%s.bin
          end
        formatters:
          - version
    - type: write
      write:
        content:
          copy running-config startup-config
    - type: readUntil
      readUntil:
        timeout: 3m
        until:
          contains: "100%"
    - type: readUntil
      readUntil:
        timeout: 1m
        until:
          contains: "switch#"
    # small delay to ensure everything saved nicely
    - type: wait
      wait:
        duration: 10s
  sparsify: false
run:
  process:
    - type: prompts
      prompts:
        timeout: 20m
        prompts:
          - prompt:
              contains: "login:"
            response: "admin"
            once: true
          - prompt:
              contains: "Password:"
            response: "admin"
            once: true
            hidden: true
          - prompt:
              contains: "switch#"
            response: ""
            once: true
            completes: true
  configProcess:
    # disable pagination
    - type: write
      write:
        content: |
          term len 0
          term width 511
    # config mode so we can set username/password/hostname
    - type: write
      write:
        content: |
          configure terminal
    - type: write
      write:
        content: username %s password 0 %s role network-admin
        formatters:
          - username
          - password
    - type: write
      write:
        content: hostname %s
        formatters:
          - hostname
    # load any user provided startup config
    - type: write
      write:
        contentFromStartupConfig: true
    # get outa config mode
    - type: write
      write:
        content: |
          end
    # n9kv can let us do the copy run start but then poop out on us with a message
    # "configuraiton update aborted" -- so we'll ship it, then watch for that or completion;
    # we also cant wait till we see "switch#" or something because the user may have configured
    # a different hostname... so gotta check for pattern, not a static "switch#" or whatever
    - type: prompts
      prompts:
        timeout: 5m
        initialInput: copy running-config startup-config
        prompts:
          - prompt:
              containsPattern: "(?ims)configuration update aborted: system not ready.*^.*[>#$]\\s?+$"
            response: copy running-config startup-config
            once: false
          - prompt:
              containsPattern: "^.*[>#$]\\s?+$"
            response: ""
            once: true
            completes: true
