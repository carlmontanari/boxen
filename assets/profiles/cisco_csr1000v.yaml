---
# Use Cisco's serial console image (csr1000v-universalk9.<version>-serial.qcow2); the other
# images print their console to the VGA display, out of reach of the profile automation.
name: cisco_csr1000v
diskPatterns:
  - "(?i)csr1000v-universalk9.*\\.qcow2$"
versionPattern: "(?i)universalk9\\.(\\d+\\.\\d+\\.\\d+)"
scrapliDefinitionNameOrFile: cisco_iosxe
scrapliReturnChar: "\r\n"
virtualMachine:
  memory: 4096
  cpuCores: 1
  serialPortCount: 1
  nicType: virtio-net-pci
  nicCount: 16
  nicPerBus: 26
  managementPassthrough: true
packaging:
  process:
    # first boot, without a configuration: decline the dialogs, then wait for PnP discovery to
    # stop, before which the console ignores input
    - type: prompts
      prompts:
        timeout: 20m
        prompts:
          - name: initial configuration dialog
            prompt:
              contains: "initial configuration dialog? [yes/no]:"
            response: "no"
            once: true
          # any input ends autoinstall, and the answer is not echoed
          - name: terminate autoinstall
            prompt:
              contains: "terminate autoinstall? [yes]:"
            response: "yes"
            hidden: true
            once: true
          - name: pnp discovery stopped
            prompt:
              contains: "PNP_DISCOVERY_STOPPED"
            response: ""
            once: true
            completes: true
    - type: prompts
      prompts:
        timeout: 5m
        initialInput: "\r"
        prompts:
          - name: get started
            prompt:
              contains: "Press RETURN to get started"
            response: ""
          - name: user exec
            prompt:
              containsPattern: '(?m)^Router>\s*$'
            response: enable
            once: true
          - name: privileged exec
            prompt:
              containsPattern: '(?m)^Router#\s*$'
            response: ""
            once: true
            completes: true
    - type: write
      write:
        content: |
          terminal length 0
          terminal width 511
    # baseline configuration; the console opens in privileged exec mode and never times out, so
    # the runtime and save processes need no console login. The data interfaces are enabled: the
    # running configuration only lists "shutdown", so a saved configuration applied on top of the
    # baseline restores the interface states
    - type: write
      write:
        content: |
          configure terminal
          hostname router
          username admin privilege 15 secret 0 admin
          ip domain name example.com
          no ip domain lookup
          crypto key generate rsa modulus 2048
          line con 0
          exec-timeout 0 0
          privilege level 15
          logging synchronous
          exit
          line vty 0 4
          login local
          transport input all
          exit
          ipv6 unicast-routing
          vrf definition clab-mgmt
          description Containerlab management VRF (DO NOT DELETE)
          address-family ipv4
          exit-address-family
          address-family ipv6
          exit-address-family
          exit
          interface GigabitEthernet1
          description Containerlab management interface
          vrf forwarding clab-mgmt
          ip address 10.0.0.15 255.255.255.0
          no shutdown
          exit
          ip route vrf clab-mgmt 0.0.0.0 0.0.0.0 10.0.0.2
          interface range GigabitEthernet2 - 17
          no shutdown
          exit
          restconf
          netconf-yang
          end
    - &saveConfig
      type: write
      write:
        content: write memory
    - &saveComplete
      type: readUntil
      readUntil:
        timeout: 3m
        until:
          contains: "[OK]"
    # small delay to ensure everything saved nicely
    - type: wait
      wait:
        duration: 10s
run:
  process:
    - &privilegedExec
      type: prompts
      prompts:
        timeout: 20m
        initialInput: "\r"
        prompts:
          - name: get started
            prompt:
              contains: "Press RETURN to get started"
            response: ""
          - name: privileged exec
            prompt:
              containsPattern: '(?m)^[\w.-]+#\s*$'
            response: ""
            once: true
            completes: true
    - &terminal
      type: write
      write:
        content: |
          terminal length 0
          terminal width 511
    # node identity and management addresses from containerlab
    - type: write
      write:
        content: |
          configure terminal
          hostname {{ .hostname }}
          username {{ .username }} privilege 15 secret 0 {{ .password }}
          interface GigabitEthernet1
          {{ if .mgmtDHCP }}
          ip address dhcp
          {{ else }}
          {{ if .mgmtIPv4 }}
          ip address {{ .mgmtIPv4Address }} {{ .mgmtIPv4Netmask }}
          {{ end }}
          {{ if .mgmtIPv6 }}
          ipv6 address {{ .mgmtIPv6 }}
          {{ end }}
          {{ end }}
          exit
          {{ if not .mgmtDHCP }}
          no ip route vrf clab-mgmt 0.0.0.0 0.0.0.0 10.0.0.2
          {{ if .mgmtIPv4Gateway }}
          ip route vrf clab-mgmt 0.0.0.0 0.0.0.0 {{ .mgmtIPv4Gateway }}
          {{ end }}
          {{ if .mgmtIPv6Gateway }}
          ipv6 route vrf clab-mgmt ::/0 {{ .mgmtIPv6Gateway }}
          {{ end }}
          {{ end }}
          end
    - *saveConfig
    - *saveComplete
  configProcess:
    - type: write
      write:
        content: configure terminal
    - type: write
      write:
        contentFromStartupConfig: true
    - type: write
      write:
        content: end
    - *saveConfig
    - *saveComplete
  saveProcess:
    - *privilegedExec
    - *terminal
    # the running configuration without the header that precedes it, and without:
    # - the certificates of the self-signed trustpoints, which IOS creates itself: "brief" leaves
    #   out their data, and without data a certificate line would take the following
    #   configuration as certificate input
    # - the boot settings stored with the boot loader, the console and diagnostic levels, and the
    #   license UDI of the instance: applying them rewrites the boot loader configuration, which a
    #   container stop shortly after can leave unreadable
    - type: capture
      capture:
        timeout: 2m
        command: >-
          show running-config brief | exclude ^ certificate|^platform console|^diagnostic bootup|^license udi
        start:
          containsPattern: '(?m)^Current configuration : \d+ bytes'
        end:
          containsPattern: '(?m)^[\w.-]+#\s*$'
