---
name: community_sonic
diskPatterns:
  - '(?i)^sonic-vs.*\.img$'
versionPattern: '_(\d+)\.img$'
scrapliDefinitionNameOrFile: generic
scrapliReturnChar: "\r"
virtualMachine:
  memory: 4096
  cpuEmulation: host
  cpuCores: 4
  serialPortCount: 1
  nicType: e1000
  nicCount: 16
  nicPerBus: 26
  managementPassthrough: true
packaging:
  shrinkify: true
  process:
    - type: readUntil
      readUntil:
        timeout: 20m
        until:
          containsPattern: '(?m)^[^\r\n]+ login: *$'
    - type: prompts
      prompts:
        timeout: 20m
        initialInput: "\r"
        prompts:
          - name: enter login
            prompt:
              containsPattern: '(?m)^[^\r\n]+ login: *$'
            response: admin
            once: true
          - name: enter password
            prompt:
              contains: 'Password:'
            response: YourPaSsWoRd
            hidden: true
            once: true
          - name: finish login
            prompt: &linuxShell
              containsPattern: '(?m):~\$ *$'
            response: ""
            hidden: true
            once: true
            completes: true
    - &shellReady
      type: readUntil
      readUntil:
        timeout: 1m
        until: *linuxShell
    - type: write
      write:
        hidden: true
        content: sudo passwd admin
    - type: prompts
      prompts:
        timeout: 20m
        prompts:
          - name: new password
            prompt:
              contains: 'New password:'
            response: admin
            hidden: true
            once: true
          - name: retype new password
            prompt:
              contains: 'Retype new password:'
            response: admin
            hidden: true
            once: true
            completes: true
    - type: readUntil
      readUntil:
        timeout: 1m
        until:
          containsPattern: '(?m)^passwd: password updated successfully\r?\n[^\r\n]*:~\$ *$'
    - &servicesReady
      type: write
      write:
        hidden: true
        content: >-
          sudo timeout 300 bash -o pipefail -c 'until systemctl is-active --quiet database &&
          systemctl is-active --quiet swss && systemctl is-active --quiet syncd && systemctl is-active --quiet bgp &&
          docker exec database redis-cli -n 4 PING | grep -qx PONG &&
          docker exec syncd supervisorctl status syncd | grep -q RUNNING &&
          docker exec swss supervisorctl status orchagent | grep -q RUNNING;
          do sleep 2; done' && printf '\nBOXEN_OK\n'
    - &commandComplete
      type: readUntil
      readUntil:
        timeout: 6m
        until:
          containsPattern: '(?m)^BOXEN_OK\r?\n[^\r\n]*:~\$ *$'
    - type: write
      write:
        hidden: true
        content: sudo config save -y && sudo sync && sudo shutdown -h now
    - type: readUntil
      readUntil:
        timeout: 3m
        until:
          contains: 'reboot: Power down'
run:
  # Console login uses the packaged admin/admin credentials.
  # Recreate provisioned containers; restarting them is unsupported.
  process:
    - type: readUntil
      readUntil:
        timeout: 20m
        until:
          containsPattern: '(?m)^[^\r\n]+ login: *$'
    - type: prompts
      prompts:
        timeout: 10m
        initialInput: "\r"
        prompts:
          - name: enter login
            prompt:
              containsPattern: '(?m)^[^\r\n]+ login: *$'
            response: admin
            once: true
          - name: enter password
            prompt:
              contains: 'Password:'
            response: admin
            hidden: true
            once: true
          - name: finish login
            prompt: *linuxShell
            response: ""
            hidden: true
            once: true
            completes: true
    - *shellReady
    # Set the node username, password, and hostname as shell variables.
    - type: write
      write:
        hidden: true
        content: >-
          boxen_user={{ if .username }}{{ shellQuote .username }}{{ else }}admin{{ end }};
          boxen_password={{ if .password }}{{ shellQuote .password }}{{ else }}admin{{ end }};
          boxen_hostname={{ if .hostname }}{{ shellQuote .hostname }}{{ else }}sonic{{ end }};
          printf '\nBOXEN_OK\n'
    - *commandComplete
    # Optionally create a custom user if it does not exist; admin already exists.
    # Set admin groups and the requested password for the selected user (admin by default).
    - type: write
      write:
        hidden: true
        content: >-
          (id "$boxen_user" >/dev/null 2>&1 || sudo useradd -m -s /bin/bash "$boxen_user") &&
          test "$(id -u "$boxen_user")" -ge 1000 &&
          test "$(id -u "$boxen_user")" -lt 60000 &&
          sudo usermod -aG sudo,admin,docker,redis "$boxen_user" &&
          printf '%s:%s\n' "$boxen_user" "$boxen_password" | sudo chpasswd && printf '\nBOXEN_OK\n'
    - *commandComplete
    - &nodeHostname
      type: write
      write:
        hidden: true
        content: >-
          sudo config hostname "$boxen_hostname" && sudo systemctl restart hostname-config &&
          test "$(hostname)" = "$boxen_hostname" && getent hosts "$boxen_hostname" && printf '\nBOXEN_OK\n'
    - *commandComplete
    - &managementIPv4
      type: write
      write:
        hidden: true
        content: >-
          {{ if .mgmtDHCP }}true{{ else }}{{ if .mgmtIPv4 }}sudo config interface ip add eth0 {{ shellQuote .mgmtIPv4 }}
          {{ shellQuote .mgmtIPv4Gateway }}{{ else }}true{{ end }}{{ end }} && printf '\nBOXEN_OK\n'
    - *commandComplete
    - &managementIPv6
      type: write
      write:
        hidden: true
        content: >-
          {{ if .mgmtDHCP }}true{{ else }}{{ if .mgmtIPv6 }}sudo config interface ip add eth0 {{ shellQuote .mgmtIPv6 }}
          {{ shellQuote .mgmtIPv6Gateway }}{{ else }}true{{ end }}{{ end }} && printf '\nBOXEN_OK\n'
    - *commandComplete
    - &applyManagement
      type: write
      write:
        hidden: true
        content: sudo systemctl restart interfaces-config && printf '\nBOXEN_OK\n'
    - *commandComplete
    - &saveConfiguration
      type: write
      write:
        hidden: true
        content: sudo config save -y && printf '\nBOXEN_OK\n'
    - *commandComplete
    - *servicesReady
    - *commandComplete
  configProcess:
    # Send JSON as short base64 lines: no shell interpolation or template expansion.
    - type: write
      write:
        hidden: true
        content: "stty -echo; cat > /tmp/boxen-startup.b64 <<'BOXEN_CONFIG_EOF'"
    - type: readUntil
      readUntil:
        timeout: 1m
        until:
          containsPattern: '(?m)^> $'
    - type: write
      write:
        hidden: true
        content: '{{ fileBase64 "/config/startup-config.cfg" }}'
    - type: write
      write:
        hidden: true
        content: BOXEN_CONFIG_EOF
    - *shellReady
    - type: write
      write:
        hidden: true
        content: >-
          stty echo && base64 -d /tmp/boxen-startup.b64 > /tmp/boxen-startup.json &&
          python3 -c 'import json; d=json.load(open("/tmp/boxen-startup.json"));
          assert isinstance(d,dict) and all(isinstance(v,dict) for v in d.values()), "startup config must be a ConfigDB JSON object"' &&
          sudo config load -y /tmp/boxen-startup.json && printf '\nBOXEN_OK\n'
    - *commandComplete
    # Reapply the runtime hostname and configured static management addresses after import.
    - *nodeHostname
    - *commandComplete
    - *managementIPv4
    - *commandComplete
    - *managementIPv6
    - *commandComplete
    - *applyManagement
    - *commandComplete
    - *saveConfiguration
    - *commandComplete
    - *servicesReady
    - *commandComplete
    - type: write
      write:
        hidden: true
        content: rm -f /tmp/boxen-startup.b64 /tmp/boxen-startup.json && printf '\nBOXEN_OK\n'
    - *commandComplete
