name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'install.sh'
      - 'overrides/**'
      - 'zensical.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'Makefile'
      - '.github/vars.env'
      - '.github/workflows/docs.yaml'
      - '.github/scripts/**'
      - 'wrangler.toml'
  pull_request:
    paths:
      - 'docs/**'
      - 'install.sh'
      - 'overrides/**'
      - 'zensical.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'Makefile'
      - '.github/vars.env'
      - '.github/workflows/docs.yaml'
      - '.github/scripts/**'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read tool versions
        run: cat .github/vars.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build and validate
        run: make docs-build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read tool versions
        run: cat .github/vars.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
      - name: Check preview comment logic
        run: node --test .github/scripts/pr-comment.test.cjs
      - name: Deploy production
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy
      - name: Upload preview version
        if: github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Update preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          WRANGLER_OUTPUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            await require('./.github/scripts/pr-comment.cjs')({ github, context, core, kind: 'docs' });
      - name: Production summary
        if: github.event_name != 'pull_request'
        run: echo 'Documentation deployed to https://boxen.containerlab.dev/' >> "$GITHUB_STEP_SUMMARY"
