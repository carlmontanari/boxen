---
name: cicd

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  test:
    uses: ./.github/workflows/test.yaml

  docs:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docs.yaml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read tool versions
        run: cat .github/vars.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build CLI
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          version="0.0.0-$(git rev-parse --short HEAD)"
          go build -trimpath \
            -ldflags "-s -w -X github.com/carlmontanari/boxen/constants.Version=$version" \
            -o dist/boxen ./cmd
          go version -m dist/boxen
      - uses: actions/upload-artifact@v7
        id: artifact
        with:
          name: boxen-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/boxen
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Download summary
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          PLATFORM: ${{ matrix.os }}/${{ matrix.arch }}
        run: echo "[$PLATFORM CLI download]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

  comment-builds:
    needs: [build, docs]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read tool versions
        run: cat .github/vars.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check build comment logic
        run: node --test .github/scripts/pr-comment.test.cjs
      - name: Update build and preview comment
        uses: actions/github-script@v9
        env:
          DOCS_STATUS: ${{ needs.docs.result }}
          DOCS_PREVIEW_URL: ${{ needs.docs.outputs.preview_url }}
          DOCS_ALIAS_URL: ${{ needs.docs.outputs.alias_url }}
          BINARY_STATUS: ${{ needs.build.result }}
        with:
          script: |
            await require('./.github/scripts/pr-comment.cjs')({ github, context, core });
